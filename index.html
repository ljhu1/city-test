<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>测一测，你适合定居的城市</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316181C'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23E0A800' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23E0A800'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
  :root{
    --ink:#16181C;
    --ink-soft:#3A3C40;
    --muted:#7E7B70;
    --paper:#EFEDE4;
    --card:#FFFDF7;
    --line:#D8D3C6;
    --line-soft:#E6E1D3;
    --sand:#F5F2E8;
    --font-display:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    --font-body:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [data-custom-element="doubao-watermark"]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background-color:#D5D0BE;
    background-image:
      radial-gradient(80% 50% at 50% -8%, rgba(255,253,247,.85), rgba(255,253,247,0) 70%),
      radial-gradient(55% 42% at -2% 106%, rgba(31,142,138,.26), transparent 68%),
      radial-gradient(55% 42% at 102% -4%, rgba(196,50,60,.22), transparent 68%),
      repeating-linear-gradient(0deg, rgba(22,24,28,.09) 0 1px, transparent 1px 32px),
      repeating-linear-gradient(90deg, rgba(22,24,28,.09) 0 1px, transparent 1px 32px);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:30px 22px calc(26px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    position:relative;
    isolation:isolate;
    background-color:#FAF7EE;
    background-image:
      /* 中央纸面纱：让文字区安静，纹理收向四周 */
      radial-gradient(112% 80% at 50% 34%, rgba(250,247,238,.97) 0%, rgba(250,247,238,.88) 30%, rgba(250,247,238,.54) 52%, rgba(250,247,238,.18) 70%, rgba(250,247,238,0) 86%),
      /* 城市线色柔光 */
      radial-gradient(74% 46% at 0% -8%, rgba(196,50,60,.32), rgba(196,50,60,0) 64%),
      radial-gradient(68% 44% at 104% 0%, rgba(42,78,143,.32), rgba(42,78,143,0) 64%),
      radial-gradient(74% 48% at -8% 106%, rgba(31,142,138,.32), rgba(31,142,138,0) 66%),
      radial-gradient(72% 46% at 106% 104%, rgba(224,168,0,.36), rgba(224,168,0,0) 66%),
      radial-gradient(54% 32% at 92% 34%, rgba(122,90,166,.22), rgba(122,90,166,0) 72%),
      /* 地图纹理：线网 / 等高线 / 网点 */
      url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22360%22%20height=%22360%22%20viewBox=%220%200%20360%20360%22%3E%3Cg%20fill=%22none%22%20stroke=%22%2323262B%22%20stroke-width=%221.2%22%20stroke-opacity=%220.20%22%3E%3Cpath%20d=%22M-20%20268%20L120%20268%20L206%20180%20L380%20180%22/%3E%3Cpath%20d=%22M52%20-10%20L52%20128%20L176%20214%20L176%20380%22/%3E%3Cpath%20d=%22M-10%2066%20L96%2066%20L158%20128%20L286%20128%20L356%2062%22/%3E%3Cpath%20d=%22M268%20380%20L268%20222%20L162%20116%20L-10%20116%22/%3E%3Cpath%20d=%22M-10%20318%20L86%20318%20L158%20266%22/%3E%3Cpath%20d=%22M120%20-10%20L120%2046%20L206%2046%22/%3E%3C/g%3E%3Cg%20fill=%22%2323262B%22%20fill-opacity=%220.30%22%3E%3Ccircle%20cx=%22120%22%20cy=%22268%22%20r=%223.2%22/%3E%3Ccircle%20cx=%22206%22%20cy=%22180%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2252%22%20cy=%22128%22%20r=%223.2%22/%3E%3Ccircle%20cx=%22176%22%20cy=%22214%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2296%22%20cy=%2266%22%20r=%223.2%22/%3E%3Ccircle%20cx=%22158%22%20cy=%22128%22%20r=%223.2%22/%3E%3Ccircle%20cx=%22268%22%20cy=%22222%22%20r=%223.2%22/%3E%3Ccircle%20cx=%22162%22%20cy=%22116%22%20r=%223.2%22/%3E%3Ccircle%20cx=%2286%22%20cy=%22318%22%20r=%223.2%22/%3E%3C/g%3E%3C/svg%3E"),
      url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22460%22%20height=%22460%22%20viewBox=%220%200%20460%20460%22%3E%3Cg%20fill=%22none%22%20stroke=%22%2323262B%22%20stroke-opacity=%220.13%22%20stroke-width=%221%22%3E%3Cpath%20d=%22M10%20410%20C%2096%20320,%20140%20278,%20240%20246%20S%20356%20168,%20452%2058%22/%3E%3Cpath%20d=%22M10%20444%20C%20108%20352,%20162%20310,%20262%20278%20S%20372%20206,%20462%20100%22/%3E%3Cpath%20d=%22M10%20378%20C%2086%20288,%20128%20246,%20228%20214%20S%20342%20136,%20438%2024%22/%3E%3Cpath%20d=%22M0%2070%20C%2076%20132,%20132%20164,%20208%20196%20S%20330%20268,%20462%20356%22/%3E%3Cpath%20d=%22M10%20104%20C%2086%20162,%20144%20194,%20220%20226%20S%20340%20300,%20462%20388%22/%3E%3Cpath%20d=%22M0%20140%20C%2078%20196,%20140%20226,%20216%20258%20S%20336%20336,%20460%20420%22/%3E%3C/g%3E%3C/svg%3E"),
      url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2216%22%20height=%2216%22%20viewBox=%220%200%2016%2016%22%3E%3Ccircle%20cx=%224%22%20cy=%224%22%20r=%221%22%20fill=%22%2323262B%22%20fill-opacity=%220.13%22/%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%221%22%20fill=%22%2323262B%22%20fill-opacity=%220.13%22/%3E%3C/svg%3E");
    background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat,repeat;
    background-size:auto,auto,auto,auto,auto,auto,360px 360px,460px 460px,16px 16px;
    background-blend-mode:normal,normal,normal,normal,normal,normal,multiply,multiply,normal;
  }
  /* 纸纹颗粒 + 四角暗角 */
  .app::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22160%22%20height=%22160%22%3E%3Cfilter%20id=%22n%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.8%22%20numOctaves=%223%22%20stitchTiles=%22stitch%22/%3E%3CfeColorMatrix%20type=%22saturate%22%20values=%220%22/%3E%3C/filter%3E%3Crect%20width=%22160%22%20height=%22160%22%20filter=%22url(%23n)%22%20opacity=%220.5%22/%3E%3C/svg%3E"),
      radial-gradient(130% 100% at 50% 46%, rgba(22,24,28,0) 48%, rgba(22,24,28,.13) 100%);
    background-size:160px 160px,100% 100%;
    background-repeat:repeat,no-repeat;
    opacity:.45;
    mix-blend-mode:multiply;
  }
  /* 左边缘的多线路色条 */
  .app::after{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;width:5px;
    z-index:0;
    pointer-events:none;
    opacity:.85;
    background:linear-gradient(180deg,
      #C4323C 0 14%,#2A4E8F 14% 28%,#1F8E8A 28% 42%,#DE5A26 42% 56%,
      #4C8C2B 56% 70%,#7A5AA6 70% 84%,#E0A800 84% 100%);
    box-shadow:inset 0 0 0 1px rgba(22,24,28,.10);
  }
  @media(min-width:640px){
    body{align-items:center;padding:36px 0}
    .app{min-height:760px;padding:40px 38px;box-shadow:0 24px 48px -28px rgba(22,24,28,.55)}
  }
  .view{display:none;flex-direction:column;flex:1;min-height:0;position:relative;z-index:1}
  .view.active{display:flex}

  /* ===== 视图：首页 ===== */
  .intro-top{padding-top:6px}
  .intro-title{
    font-family:var(--font-display);
    font-weight:400;
    font-size:clamp(30px,8.6vw,38px);
    line-height:1.3;
    letter-spacing:.5px;
    margin:0;
  }
  @media(min-width:640px){.intro-title{font-size:38px}}
  .intro-sub{
    margin:16px 0 0;
    font-size:15px;
    line-height:1.75;
    color:var(--ink-soft);
    font-weight:400;
    max-width:20em;
  }
  .intro-rule{height:1px;background:var(--ink);margin:24px 0 0;opacity:.9}
  .tags{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column}
  .route-art{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0;min-height:110px}
  .route-art svg{width:100%;height:auto;max-height:140px;opacity:.92}
  .tags li{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    line-height:1.6;
    padding:13px 0 12px;
    border-bottom:1px solid var(--line-soft);
    color:var(--ink-soft);
    font-weight:500;
  }
  .tags li:first-child{border-top:1px solid var(--line-soft)}
  .tags .mark{
    font-size:15px;
    line-height:1;
    flex:none;
  }
  .cta{
    margin-top:22px;
    width:100%;
    border:0;
    background:var(--ink);
    color:#FFFDF7;
    font-family:var(--font-body);
    font-size:17px;
    font-weight:700;
    letter-spacing:2px;
    height:56px;
    border-radius:3px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:background .18s ease,transform .18s ease;
  }
  .cta:hover{background:#000}
  .cta:active{transform:translateY(1px)}
  .intro-foot{
    margin:14px 0 0;
    text-align:center;
    font-size:11px;
    letter-spacing:.4px;
    color:var(--muted);
  }

  /* ===== 视图：答题 ===== */
  .q-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .q-count{font-size:13px;font-weight:700;letter-spacing:1px}
  .q-left{font-size:11px;color:var(--muted);letter-spacing:1px}
  .route{display:grid;grid-template-columns:repeat(32,1fr);gap:3px;margin:12px 0 0}
  .route i{display:block;height:9px;background:var(--line-soft);border-radius:1px}
  .route i.done{background:var(--ink)}
  .route i.now{background:var(--ink);opacity:.55}
  .q-body{flex:1;display:flex;flex-direction:column;justify-content:flex-start;padding:24px 0 4px}
  .q-text{
    margin:0 0 6px;
    font-size:clamp(20px,5.6vw,23px);
    line-height:1.55;
    font-weight:700;
    letter-spacing:.2px;
    min-height:3.1em;
  }
  .q-hint{font-size:11px;color:var(--muted);margin:0 0 18px;letter-spacing:.6px}
  .opts{display:flex;flex-direction:column;gap:10px;margin:0}
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    text-align:left;
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    background:rgba(249,246,236,.88);
    border:1px solid var(--line);
    border-radius:3px;
    padding:15px 14px;
    cursor:pointer;
    transition:background .16s ease,color .16s ease,border-color .16s ease,transform .16s ease;
  }
  .opt:hover{background:#F1EDDF;border-color:#BFB9A9}
  .opt:active{transform:translateY(1px)}
  .opt .bdg{
    flex:none;
    width:22px;height:22px;
    border:1px solid var(--ink);
    border-radius:50%;
    font-size:11px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    margin-top:1px;
    transition:background .16s ease,color .16s ease,border-color .16s ease;
  }
  .opt.chosen{background:var(--ink);border-color:var(--ink);color:#FFFDF7}
  .opt.chosen .bdg{background:#FFFDF7;color:var(--ink);border-color:#FFFDF7}
  .q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:13px;border-top:1px solid var(--line-soft)}
  .ghost{
    border:0;background:none;font-family:var(--font-body);font-size:12px;
    color:#615E55;letter-spacing:1px;cursor:pointer;padding:6px 0;
  }
  .ghost:hover{color:var(--ink)}
  .ghost[disabled]{opacity:.35;cursor:default}

  /* ===== 视图：结果 ===== */
  .res-eyebrow{font-size:11px;letter-spacing:3px;color:var(--muted);margin:0}
  .plate{margin-top:12px;display:flex;align-items:stretch;gap:0}
  .plate-bar{width:10px;border-radius:2px;flex:none}
  .plate-body{padding-left:16px;min-width:0}
  .plate-name{
    font-size:clamp(34px,10vw,42px);
    font-weight:900;
    line-height:1.1;
    letter-spacing:2px;
    margin:0;
  }
  .plate-pin{margin:8px 0 0;font-size:11px;letter-spacing:3px;color:var(--muted);font-weight:500}
  .hit-line{margin:18px 0 0;font-size:14px;line-height:1.7;color:var(--ink-soft)}
  .hit-line strong{font-size:17px;font-weight:900;margin:0 2px}
  .persona{
    margin:14px 0 0;
    font-family:var(--font-display);
    font-size:20px;
    line-height:1.5;
    letter-spacing:.4px;
  }
  .sec-label{
    font-size:11px;letter-spacing:2.5px;color:var(--muted);
    margin:26px 0 10px;display:flex;align-items:center;gap:8px;
  }
  .sec-label::after{content:'';flex:1;height:1px;background:var(--line-soft)}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar-row{display:grid;grid-template-columns:44px 1fr 30px;align-items:center;gap:10px}
  .bar-name{font-size:13px;font-weight:700;letter-spacing:1px}
  .bar-track{display:block;height:8px;background:#E6E0CF;border-radius:1px;overflow:hidden}
  .bar-fill{display:block;height:100%;border-radius:1px;transition:width .55s cubic-bezier(.2,.7,.3,1)}
  .bar-num{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .dna{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
  .dna span{
    font-size:12px;letter-spacing:1px;padding:6px 10px;
    border:1px solid var(--line);border-radius:2px;color:var(--ink-soft);
  }
  .desc{font-size:15px;line-height:1.95;color:var(--ink-soft);margin:0;text-align:justify}
  .scene{
    margin:18px 0 0;padding:16px 16px;
    border-radius:3px;
    font-size:14px;line-height:1.85;
  }
  .scene b{display:block;font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:6px;opacity:.75}
  .note{font-size:12px;line-height:1.8;color:var(--muted);margin:14px 0 0;padding-left:12px;border-left:2px solid var(--line)}
  .next-stop{
    margin-top:12px;display:flex;align-items:center;gap:12px;
    padding:14px 14px;background:rgba(245,242,232,.62);border:1px solid var(--line-soft);border-radius:3px;
  }
  .next-stop .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .next-stop .nn{display:block;font-size:15px;font-weight:700;letter-spacing:1px}
  .next-stop .np{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .res-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
  .btn-primary{
    border:0;background:var(--ink);color:#FFFDF7;font-family:var(--font-body);
    font-size:15px;font-weight:700;letter-spacing:2px;height:52px;border-radius:3px;cursor:pointer;
  }
  .btn-primary:hover{background:#000}
  .btn-line{
    border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--font-body);
    font-size:14px;font-weight:500;letter-spacing:2px;height:48px;border-radius:3px;cursor:pointer;
  }
  .btn-line:hover{background:var(--ink);color:#FFFDF7}
  .copy-tip{font-size:11px;color:var(--muted);text-align:center;margin:2px 0 0;height:14px}

  /* ===== 视图：城市图鉴 ===== */
  .gal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .gal-title{font-family:var(--font-display);font-size:22px;margin:0;letter-spacing:1px}
  .gal-sub{font-size:12px;color:var(--muted);margin:8px 0 18px;line-height:1.7}
  .gal-list{display:flex;flex-direction:column;gap:12px}
  .gal-card{border:1px solid var(--line-soft);border-radius:3px;padding:14px 14px 14px 16px;position:relative;background:rgba(253,251,244,.60)}
  .gal-card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--c)}
  .gal-card h3{margin:0;font-size:16px;font-weight:900;letter-spacing:2px}
  .gal-card .gp{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.7}
  .gal-card .gt{font-size:13px;color:var(--ink-soft);margin:7px 0 0;line-height:1.7}
  .gal-foot{margin:20px 0 0}
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== 视图：首页 ===== -->
  <section class="view active" id="view-intro">
    <div class="intro-top">
      <h1 class="intro-title">测一测，<br>你适合定居的城市</h1>
      <p class="intro-sub">凭你的脑洞偏好，匹配和你同频的城市</p>
      <div class="intro-rule"></div>
    </div>
    <ul class="tags">
      <li><span class="mark">✅</span><span>生活节奏 ｜ 快慢随你心意</span></li>
      <li><span class="mark">✅</span><span>吃喝口味 ｜ 适配你的味蕾</span></li>
      <li><span class="mark">✅</span><span>日常状态 ｜ 匹配你的精神状态</span></li>
      <li><span class="mark">✅</span><span>城市气质 ｜ 找到你的本命城市</span></li>
    </ul>
    <div class="route-art" aria-hidden="true">
      <svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#16181C" stroke-linecap="round" stroke-opacity=".22">
          <path d="M16 104 H384" stroke-width="2"/>
          <path d="M108 22 H196 L238 60" stroke-width="1.4"/>
          <path d="M286 140 L322 100" stroke-width="1.4"/>
          <path d="M376 34 V70" stroke-width="1.4"/>
        </g>
        <g stroke-linejoin="round"><circle cx="36" cy="104" r="5" fill="#FAF7EE" stroke="#C4323C" stroke-width="2.2"/><circle cx="68" cy="104" r="5" fill="#FAF7EE" stroke="#2A4E8F" stroke-width="2.2"/><circle cx="104" cy="104" r="5" fill="#FAF7EE" stroke="#1F8E8A" stroke-width="2.2"/><circle cx="136" cy="104" r="5" fill="#FAF7EE" stroke="#DE5A26" stroke-width="2.2"/><circle cx="172" cy="104" r="5" fill="#FAF7EE" stroke="#4C8C2B" stroke-width="2.2"/><circle cx="208" cy="104" r="5" fill="#FAF7EE" stroke="#7A5AA6" stroke-width="2.2"/><circle cx="240" cy="104" r="5" fill="#FAF7EE" stroke="#C22E76" stroke-width="2.2"/><circle cx="276" cy="104" r="5" fill="#FAF7EE" stroke="#E0A800" stroke-width="2.2"/><circle cx="308" cy="104" r="5" fill="#FAF7EE" stroke="#6C8A7A" stroke-width="2.2"/><circle cx="344" cy="104" r="5" fill="#FAF7EE" stroke="#A3A63B" stroke-width="2.2"/></g>
      </svg>
    </div>
    <button class="cta" id="btn-start">点击测试 <span aria-hidden="true">→</span></button>
    <p class="intro-foot">趣味测试仅供娱乐，找到你的本命城市 cp</p>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section class="view" id="view-quiz">
    <div class="q-head">
      <span class="q-count" id="q-count">第 01 站</span>
      <span class="q-left" id="q-left">还剩 32 站</span>
    </div>
    <div class="route" id="route" aria-hidden="true"></div>

   ['零点七五倍，慢一点才看得清','cd'],
   ['晚上两倍，白天零点五倍','cs'],
   ['一点五倍，正好还能再塞两件事','sz'],
 ]},
];

/* ===== 状态 ===== */
const state = {answers:[], order:[]};
const $ = id => document.getElementById(id);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showView(name){
  ['intro','quiz','result','gallery'].forEach(v=>{
    $('view-'+v).classList.toggle('active', v===name);
  });
  window.scrollTo(0,0);
}

function startQuiz(){
  state.answers = [];
  state.order = QUESTIONS.map(q => shuffle(q.o.map(([t,c],i)=>({t,c,i}))));
  renderQuestion();
  showView('quiz');
}

function renderRoute(){
  const done = state.answers.length;
  let html = '';
  for(let i=0;i<32;i++){
    const cls = i<done ? 'done' : (i===done && done<32 ? 'now' : '');
    html += '<i class="'+cls+'"></i>';
  }
  $('route').innerHTML = html;
  $('q-progress').textContent = done + ' / 32';
}

function renderQuestion(){
  const idx = state.answers.length;
  const total = QUESTIONS.length;
  $('q-count').textContent = '第 ' + String(idx+1).padStart(2,'0') + ' 站';
  $('q-left').textContent = '还剩 ' + (total-idx) + ' 站';
  renderRoute();

  const q = QUESTIONS[idx];
  $('q-text').textContent = q.q;
  const box = $('opts');
  box.innerHTML = '';
  const letters = ['A','B','C','D'];
  state.order[idx].forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.innerHTML = '<span class="bdg">'+letters[i]+'</span><span>'+opt.t+'</span>';
    btn.addEventListener('click', ()=>choose(btn, opt.c));
    box.appendChild(btn);
  });
  $('btn-back').disabled = idx === 0;
}

let locked = false;
function choose(el, city){
  if(locked) return;
  locked = true;
  el.classList.add('chosen');
  state.answers.push(city);
  setTimeout(()=>{
    locked = false;
    if(state.answers.length >= QUESTIONS.length){
      renderResult();
      showView('result');
    } else {
      renderQuestion();
    }
  }, 250);
}

function goBack(){
  if(locked || state.answers.length===0) return;
  state.answers.pop();
  renderQuestion();
}

/* ===== 结果计算（平分时按最近一次选中的城市优先） ===== */
function tally(){
  const scores = {};
  Object.keys(CITIES).forEach(k=>scores[k]=0);
  state.answers.forEach(c=>scores[c]++);
  const last = {};
  state.answers.forEach((c,i)=>last[c]=i);
  return Object.keys(CITIES)
    .map(k=>({k, v:scores[k], last:last[k]!==undefined?last[k]:-1}))
    .sort((a,b)=> b.v-a.v || b.last-a.last);
}

function renderResult(){
  const ranked = tally();
  const top = ranked[0];
  const city = CITIES[top.k];
  const second = ranked[1];
  const totalPicks = state.answers.length;

  $('res-bar').style.background = city.c;
  $('res-name').textContent = city.name;
  $('res-pin').textContent = city.pin + ' · 本 命 城 市';
  $('res-hit').innerHTML = '32 站里，你和它有 <strong>'+top.v+'</strong> 次隔空击掌（共 '+totalPicks+' 次选择）';
  $('res-persona').textContent = '「' + city.persona + '」';

  const max = ranked[0].v || 1;
  $('res-bars').innerHTML = ranked.slice(0,3).map(r=>{
    const c = CITIES[r.k];
    const w = Math.max(6, Math.round(r.v/max*100));
    return '<div class="bar-row">'
      + '<span class="bar-name" style="color:'+c.c+'">'+c.name+'</span>'
      + '<span class="bar-track"><span class="bar-fill" style="width:'+w+'%;background:'+c.c+'"></span></span>'
      + '<span class="bar-num">'+r.v+'</span>'
      + '</div>';
  }).join('');

  $('res-dna').innerHTML = city.dna.map(d=>'<span>'+d+'</span>').join('');
  $('res-desc').textContent = city.desc;
  $('res-scene').style.background = hexA(city.c, .10);
  $('res-scene-text').textContent = city.scene;
  $('res-note').textContent = city.note;

  const sc = CITIES[second.k];
  $('res-next').innerHTML = '<span class="dot" style="background:'+sc.c+'"></span>'
    + '<span><span class="nn">'+sc.name+' · '+sc.persona+'</span>'
    + '<span class="np">'+sc.tagline+'</span></span>';

  // 复制文案
  shareText = '我的本命城市是【'+city.name+'】——'+city.persona
    + '｜32 站里和它隔空击掌 '+top.v+' 次，B 计划是'+sc.name+'。你也测测看？';
  $('copy-tip').textContent = '';
}

let shareText = '';
function hexA(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function copyResult(){
  if(!shareText) return;
  const done = ()=>{ $('copy-tip').textContent = '已复制，去小红书发一条吧'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(shareText).then(done).catch(fallbackCopy);
  } else { fallbackCopy(); }
  function fallbackCopy(){
    const ta = document.createElement('textarea');
    ta.value = shareText;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('copy-tip').textContent = '复制失败，请长按选择文字'; }
    document.body.removeChild(ta);
  }
}

function renderGallery(){
  $('gal-list').innerHTML = Object.keys(CITIES).map(k=>{
    const c = CITIES[k];
    return '<div class="gal-card" style="--c:'+c.c+'">'
      + '<h3>'+c.name+'</h3>'
      + '<p class="gp">'+c.persona+'</p>'
      + '<p class="gt">'+c.tagline+'</p>'
      + '</div>';
  }).join('');
  showView('gallery');
}

/* ===== 绑定 ===== */
$('btn-start').addEventListener('click', startQuiz);
$('btn-back').addEventListener('click', goBack);
$('btn-copy').addEventListener('click', copyResult);
$('btn-again').addEventListener('click', startQuiz);
$('btn-gallery').addEventListener('click', renderGallery);
$('btn-gal-back').addEventListener('click', ()=>showView('result'));
$('btn-gal-again').addEventListener('click', startQuiz);

document.addEventListener('keydown', e=>{
  if(!$('view-quiz').classList.contains('active')) return;
  const idx = ['1','2','3','4'].indexOf(e.key);
  if(idx>-1){
    const btns = $('opts').querySelectorAll('.opt');
    if(btns[idx]) btns[idx].click();
  }
  if(e.key === 'Backspace'){ e.preventDefault(); goBack(); }
});
</script>

<script>
/* 清除发布容器注入的右下角水印 */
(function(){
  var SEL='[data-custom-element="doubao-watermark"]';
  function kill(){
    var list=document.querySelectorAll(SEL);
    for(var i=0;i<list.length;i++){
      var n=list[i];
      if(n && n.parentNode) n.parentNode.removeChild(n);
    }
  }
  kill();
  try{
    var mo=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        if(muts[i].addedNodes && muts[i].addedNodes.length){ kill(); break; }
      }
    });
    mo.observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
  var n=0;
  var t=setInterval(function(){ kill(); if(++n>40) clearInterval(t); },500);
})();
</script>
